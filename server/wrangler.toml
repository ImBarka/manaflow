name = "manaflow"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Retention purge, once a day at 19:00 UTC (02:00 WIB).
[triggers]
crons = ["0 19 * * *"]

# The dashboard is served as static files; only /v1/* reaches the Worker.
[assets]
directory = "../dashboard/public"

# database_id comes from `npx wrangler d1 create manaflow`; replace it when
# deploying to another Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "manaflow"
database_id = "e5070d5f-c8fc-4ecd-b3c8-384879f45124"
migrations_dir = "migrations"
